name: E2E

# Optional: not a required check. Runs keepwatch in Ubuntu 22.04 and 24.04
# containers on an x86_64 runner (see "End-to-end tests" in the README).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "test/e2e/**"
      - "internal/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: e2e
        run: make e2e
