# keepwatch configuration. All keys are snake_case.
#
# Additional *.yaml files placed in a conf.d directory next to this file
# are loaded in lexicographic order and merged into it: mappings merge
# per key (later files win), sequences such as exceptions and
# listeners.allow append, and scalars are replaced by the later file.
#
# keepwatch runs as root, so this file, the conf.d directory and every
# conf.d file must be owned by root or the running user and not
# writable by group or other (0644 or stricter here), and must not be
# symlinks; a repeated key within one mapping is rejected.

# Free-form description of this host.
host:
  profile: production

# Directory keepwatch keeps its state (the last run) in. Must be an
# absolute path. It is created with mode 0700 if it does not exist;
# otherwise it must be a real directory (not a symlink) owned by root that
# group and other cannot write to.
state_dir: /var/lib/keepwatch

# Checks to run, keyed by check id (the ids of the built-in catalog, for
# example ssh.permit_root_login or disk.usage). enabled defaults to true,
# severity is an optional override of the catalog severity (one of info, low,
# medium, high, critical), and params are merged over the catalog's
# parameters of that check.
checks:
  ssh.permit_root_login:
    severity: critical
  disk.usage:
    params:
      warn_percent: 85
      fail_percent: 95
  certs.expiry:
    enabled: false

# The listener allowlist: anything listening on a port not listed here is
# reported. port is 1-65535, proto is tcp or udp, and bind is an IP
# literal or "*" (the default) for any address.
listeners:
  allow:
    - port: 22
      proto: tcp
      bind: "*"
    - port: 53
      proto: udp
      bind: 127.0.0.1

# Expected authorized SSH key fingerprints per user, in SHA256:<base64>
# form. Users not listed here are not checked.
authorized_keys:
  expected:
    deploy:
      - SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      - SHA256:BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB

# Suppressions. check is the check id (required), match optionally
# narrows the suppression, reason is required and must not be empty, and
# expires is a YYYY-MM-DD date. An exception is active through its
# expiry date and reported as expired from the day after.
exceptions:
  - check: network.listeners
    match: tcp/0.0.0.0:8080
    reason: temporary jump host
    expires: 2099-12-31

# Redaction. Secrets in the output of a check (tokens, passwords, private
# keys, URLs with credentials, ...) are replaced by [REDACTED] before
# anything is printed, written or sent. These patterns (RE2 regular
# expressions, at most 32 of at most 256 bytes each, none that matches the
# empty string, none that compiles to a program of more than 1000
# instructions, which a large repeat count such as (a|b){500} does) are
# added to the built-in ones. If a pattern has a capturing group only the
# text of the first group is replaced, otherwise the whole match.
# redact:
#   patterns:
#     - 'corp-[0-9]{4}'
#     - 'session=([a-z0-9]+)'

# Notification channels. When ntfy is set, url and topic are required.
# url must be https, or http only for a loopback host, and any URL port
# must be 1-65535. token_file is an optional absolute path to a file
# that must be owned by the running user, mode 0600 or stricter, and at
# most 4 KiB; its content is never read during validation and is
# re-checked against these rules each time the token is read.
notify:
  ntfy:
    url: https://ntfy.example.com/keepwatch-alerts
    topic: keepwatch-alerts
    # token_file: /etc/keepwatch/ntfy.token
