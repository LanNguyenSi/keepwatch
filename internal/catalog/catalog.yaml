# keepwatch base catalog. One entry per check; ids are dotted and stable
# (they appear in configuration, exceptions and state). fix_hint is plain
# text for the operator and is never executed.
checks:
  - id: services.fail2ban_active
    title: fail2ban service is active
    kind: service_active
    params:
      service: fail2ban.service
    severity: high
    rationale: fail2ban bans hosts that guess SSH passwords. If it is not running, brute-force attempts go unchecked.
    fix_hint: Start and enable the service, for example "systemctl enable --now fail2ban".

  - id: services.unattended_upgrades_active
    title: unattended-upgrades service is active
    kind: service_active
    params:
      service: unattended-upgrades.service
    severity: medium
    rationale: Automatic security updates close known vulnerabilities without waiting for an operator.
    fix_hint: Enable the service, for example "systemctl enable --now unattended-upgrades".

  - id: packages.fail2ban_installed
    title: fail2ban is installed
    kind: package_installed
    params:
      package: fail2ban
    severity: high
    rationale: Without the package there is no protection against repeated login attempts.
    fix_hint: Install the package, for example "apt install fail2ban".

  - id: packages.unattended_upgrades_installed
    title: unattended-upgrades is installed
    kind: package_installed
    params:
      package: unattended-upgrades
    severity: medium
    rationale: Without the package security updates are only applied when someone remembers to.
    fix_hint: Install the package, for example "apt install unattended-upgrades".

  - id: packages.needrestart_installed
    title: needrestart is installed
    kind: package_installed
    params:
      package: needrestart
    severity: low
    rationale: needrestart reports services and kernels that still run outdated code after an update.
    fix_hint: Install the package, for example "apt install needrestart".

  - id: ssh.password_authentication
    title: SSH password authentication is disabled
    kind: sshd_effective
    params:
      option: passwordauthentication
      allow: [no]
    severity: high
    rationale: Password logins can be guessed or leaked; key-based logins cannot be brute-forced over the network.
    fix_hint: Set "PasswordAuthentication no" in a drop-in under /etc/ssh/sshd_config.d/ that sorts before any file that sets it to yes, and reload sshd.

  - id: ssh.permit_root_login
    title: SSH root login is restricted to keys or disabled
    kind: sshd_effective
    params:
      option: permitrootlogin
      # sshd -T prints a configured "prohibit-password" as "without-password".
      allow: [no, prohibit-password, without-password]
    severity: high
    rationale: Direct root logins with a password hand an attacker the most valuable account on one guess.
    fix_hint: Set "PermitRootLogin prohibit-password" or "PermitRootLogin no" in a drop-in under /etc/ssh/sshd_config.d/ and reload sshd.

  - id: ssh.keyboard_interactive_authentication
    title: SSH keyboard-interactive authentication is disabled
    kind: sshd_effective
    params:
      option: kbdinteractiveauthentication
      # OpenSSH before 8.7 calls the same option challengeresponseauthentication.
      aliases: [challengeresponseauthentication]
      allow: [no]
    severity: medium
    rationale: Keyboard-interactive can carry password prompts through PAM and bypass a disabled PasswordAuthentication.
    fix_hint: Set "KbdInteractiveAuthentication no" in a drop-in under /etc/ssh/sshd_config.d/ and reload sshd.

  - id: ssh.x11_forwarding
    title: SSH X11 forwarding is disabled
    kind: sshd_effective
    params:
      option: x11forwarding
      allow: [no]
    severity: low
    rationale: X11 forwarding exposes the client's display to the server and is rarely needed on a server.
    fix_hint: Set "X11Forwarding no" in a drop-in under /etc/ssh/sshd_config.d/ and reload sshd.

  - id: fail2ban.sshd_jail
    title: fail2ban sshd jail is running
    kind: fail2ban_jail
    params:
      jail: sshd
    severity: high
    rationale: The sshd jail is what turns failed SSH logins into bans; the package alone does nothing.
    fix_hint: Enable the jail with "enabled = true" under [sshd] in /etc/fail2ban/jail.d/ and restart fail2ban.

  - id: network.listeners
    title: Only allowed ports are listening
    kind: listeners
    params:
      allow_loopback: true
    severity: medium
    rationale: Every listening socket is attack surface. Anything not in the allowlist was either added by accident or by someone else.
    fix_hint: Stop the service that opened the port, bind it to a loopback address, or add it to listeners.allow in the keepwatch configuration if it is intended.

  - id: system.reboot_required
    title: No reboot is pending
    kind: reboot_required
    severity: medium
    rationale: A pending reboot means a kernel or core library update is installed but not running, so the fix is not in effect yet.
    fix_hint: Schedule a reboot at a convenient time.

  - id: network.firewall_default
    title: Incoming traffic is dropped by default
    kind: firewall_default
    severity: high
    rationale: A firewall that accepts incoming packets by default protects only the ports somebody remembered to close. With a default of drop, a new service stays unreachable until it is opened on purpose.
    fix_hint: Enable ufw with "ufw default deny incoming" and allow the ports you need first (for example "ufw allow OpenSSH"), or set the policy of your nftables input chain or of iptables and ip6tables INPUT to drop.

  - id: updates.security_pending
    title: No security updates are pending
    kind: security_updates
    params:
      max_list_age_hours: 48
    severity: high
    rationale: A pending security update is a known hole with a published fix. The check simulates an upgrade against the package lists the host has and names the packages from a security pocket; it warns when the lists are old, because then it cannot see newer updates.
    fix_hint: Run "apt update && apt upgrade" (or "apt dist-upgrade") and make sure unattended-upgrades is enabled so the lists are refreshed and security updates are applied.

  - id: docker.exposure
    title: Docker is not exposed over TCP and no container is overly privileged
    kind: docker_exposure
    severity: high
    rationale: A Docker daemon on a TCP port gives root on the host to anyone who can reach it. A privileged container, one in the host's PID or network namespace, or one with the Docker socket mounted can take over the host as well.
    fix_hint: Remove tcp:// entries from "hosts" in /etc/docker/daemon.json and -H tcp:// from the dockerd command line, and rerun the flagged containers without --privileged, --pid=host, --network=host and the socket mount. Cover intended exceptions with an exception for the container name.

  - id: ssh.authorized_keys
    title: Only expected SSH keys are authorized
    kind: authorized_keys
    severity: high
    rationale: Any key in a user's authorized_keys file logs in as that user. A key nobody expects is how an intruder keeps access.
    fix_hint: Remove the unexpected key from the file named in the evidence, or add its fingerprint to authorized_keys.expected in the keepwatch configuration if it is intended. "ssh-keygen -lf <file>" prints the fingerprints.

  - id: disk.usage
    title: File systems have free space
    kind: disk_usage
    params:
      warn_percent: 80
      fail_percent: 90
    severity: medium
    rationale: A full disk stops logging, databases and package upgrades, and an unexpectedly filling one often means a runaway log or an attacker's data.
    fix_hint: Find what grows ("du -xh --max-depth=1 /"), rotate or delete it, or extend the file system. Inodes run out separately from blocks.

  - id: certs.expiry
    title: Certificates are not about to expire
    kind: cert_expiry
    params:
      warn_days: 30
      fail_days: 14
    severity: medium
    rationale: An expired certificate breaks TLS for every client at once. Renewal jobs fail silently more often than they are noticed.
    fix_hint: Renew the certificate (for Let's Encrypt, "certbot renew") and check why the scheduled renewal did not.
